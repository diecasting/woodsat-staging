{{ define "main" }}
<div class="page-header">
  <div class="page-header__inner">
    {{/* Object 104 (/thanks/) is classified NO_H1 by the Phase 4.1A evidence.
         An H1 must NOT be invented for it, so the heading is suppressed. */}}
    {{ if ne .Params.h1_status "NO_H1" }}
      <h1>{{ .Title }}</h1>
    {{ end }}
    {{ with .Description }}<p>{{ . }}</p>{{ end }}
  </div>
</div>
<article>
  {{ .Content }}
</article>
{{ end }}
