{{/* PHASE 4.11 — card-grid wrapper. Nested {{< card >}} shortcodes render first.
   param: cols = 2 | 3 | 4 (defaults to 3) */}}
<div class="card-grid{{ if eq (.Get "cols" | default "3") "2" }} card-grid--2{{ else if eq (.Get "cols" | default "3") "4" }} card-grid--4{{ end }}">
  {{ .Inner }}
</div>
