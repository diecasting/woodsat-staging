# PHASE 4.2 PREPARATION ONLY - not deployed.
#
# TEST DOMAIN POLICY
#   Final production architecture: GitHub Pages -> custom domain -> https://woodsat.com/
#   The GitHub Pages host must NEVER become the preferred canonical domain.
#   Set isStaging = true while on any test host: it emits noindex and must not be
#   included in the production sitemap or submitted to search engines.

# PHASE 4.6 STAGING-ONLY OVERRIDE.
# PRODUCTION baseURL = custom domain ROOT. GitHub Pages serves the custom domain
# (static/CNAME -> woodsat.com) at the root path, so every relURL/RelPermalink
# asset/link (e.g. /css/main.css, /about-us/) must be root-relative with NO
# /woodsat-staging/ segment, otherwise they 404 on woodsat.com.
# NOTE: the github.io/woodsat-staging/ project URL is a noindex staging artifact;
# its subpath-prefixed preview URLs are intentionally NOT supported (SEO lock in
# deploy.yml mandates baseURL = https://woodsat.com/).
# Canonical/JSON-LD/sitemap/OG are pinned to productionBaseURL (below) so NO
# github.io value ever reaches SEO metadata.
baseURL      = "https://woodsat.com/"
languageCode = "en"
title        = "Woodsat"

# WordPress has no /categories/, /tags/ or RSS URLs in the migration set.
# Disable those kinds so the build does not invent URLs that do not exist in production.
disableKinds = ["taxonomy", "term", "RSS"]

# Staging guard - flip to false ONLY after the custom domain is live.
[params]
  isStaging = false
  # Production canonical host. SEO metadata (canonical/OG/JSON-LD/sitemap) is pinned to
  # this so the staging subpath host never appears in search-engine-facing tags.
  productionBaseURL = "https://woodsat.com"
  # PHASE 4.11.3 - FORM_BACKEND = FORMSPREE_CONNECTED
  # External Formspree endpoint. Deliberately NOT routed through route.html/relURL:
  # this is a third-party absolute URL, not a site-internal route, so it must never
  # be rewritten to /woodsat-staging/... . The endpoint is public by design
  # (standard Formspree HTML integration); no credentials or keys are stored here.
  formEndpoint = "https://formspree.io/f/xdaqjegz"
  # PHASE 6-E: global default social share image (OG + Twitter + Article schema image).
  # Existing production-safe asset; never the broken F1 asset. Pinned to production host.
  socialImage = "https://woodsat.com/uploads/2023/08/Wooden-speaker-housings.webp"

# Raw HTML is required so #rfq / #capability anchors and schema survive conversion.
[markup.goldmark.renderer]
  unsafe = true

# One canonical URL set. No staging host may appear here.
[minify]
  disableXML = true
